name: Publish Stable

on:
  release:
    types: [published]

# Never cancel a publish in flight; a half-run release is worse than a queue.
# No ${{ github.ref }} in the group, on purpose: the ref is the release tag, so
# keying on it would let two releases publish at the same time.
concurrency:
  group: publish
  cancel-in-progress: false

permissions: {}

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # OIDC, for npm trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # Nothing is cached in this job, deliberately: it is the one job whose
      # output reaches users, and a restored cache is writable by any run on
      # the default branch. A cold install costs seconds, once per release.
      # Both switches are set, because `cache` is opt-in but
      # `package-manager-cache` defaults to true - it only auto-caches when
      # `packageManager` names npm, and saying so here keeps the guarantee from
      # resting on that field staying `pnpm`.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Before the install, which is the slow step here: a release published
      # from the wrong tag would otherwise ship silently, and there is no
      # reason to pay for a cold install before finding that out.
      - name: Verify the package version matches the release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          [ "${RELEASE_TAG#v}" = "$pkg" ] ||
            { echo "::error::release tag $RELEASE_TAG does not match package.json $pkg"; exit 1; }

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Files
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Tests
        run: pnpm run test

      # --no-git-checks: the release checkout is detached at the tag, which
      # pnpm otherwise refuses to publish from.
      # --provenance: attaches a signed statement of the repository, commit and
      # workflow run that built the tarball. It needs the `id-token: write`
      # granted above, and the `repository` field in package.json, which npm
      # checks against the repository it is building from.
      - name: Publish
        run: pnpm publish --access public --no-git-checks --provenance
