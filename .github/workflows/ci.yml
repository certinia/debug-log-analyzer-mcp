name: CI

on:
  push:
    branches: [main, release/**]
  # No branch filter: a pull request onto any base, including a stacked PR
  # onto another feature branch, must be checked before it is merged.
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm run lint

  build-test:
    name: ${{ matrix.task }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        task: [Build, Test]
        include:
          - task: Build
            command: pnpm run build
          - task: Test
            command: pnpm run test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node }}
      - run: ${{ matrix.command }}

  eval:
    name: Eval (tool responses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm run build
      - name: Check tool responses stay answerable and lean
        run: pnpm run eval
