name: CI

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main, release/**]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install Packages
        run: HUSKY=0 pnpm install --frozen-lockfile
      - run: pnpm run lint

  build-test:
    name: ${{ matrix.task }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
        task: [Build, Test]
        include:
          - task: Build
            command: pnpm run build
          - task: Test
            command: pnpm run test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - name: Install Packages
        run: HUSKY=0 pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}

  eval:
    name: Eval (tool responses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install Packages
        run: HUSKY=0 pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Check tool responses stay answerable and lean
        run: pnpm run eval
