name: 'Set up Node and pnpm'
description: 'Install pnpm, set up Node with a warm pnpm store, and install the dependencies.'

inputs:
  node-version:
    description: 'Node version to use. Defaults to the version in .nvmrc.'
    required: false
    default: ''
  registry-url:
    description: 'npm registry to authenticate against. Only the publish workflow needs this.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Resolved here rather than passing both node-version and node-version-file
    # to setup-node, which warns when it is given both.
    - name: Resolve the Node version
      id: node-version
      shell: bash
      env:
        REQUESTED: ${{ inputs.node-version }}
      run: echo "value=${REQUESTED:-$(cat .nvmrc)}" >> "$GITHUB_OUTPUT"

    # Must run before setup-node: the pnpm cache needs `pnpm store path`.
    - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.node-version.outputs.value }}
        cache: 'pnpm'
        registry-url: ${{ inputs.registry-url }}

    - name: Install Packages
      shell: bash
      run: pnpm install --frozen-lockfile
