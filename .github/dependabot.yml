version: 2
updates:
  - package-ecosystem: 'npm' # reads pnpm-lock.yaml
    directory: '/'
    schedule:
      interval: 'weekly'
    versioning-strategy: auto
    # Let a release settle before adopting it; a compromised publish is
    # usually yanked within days.
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      # Types track the engines floor, not the newest runtime. On newer types
      # tsc accepts an API Node 22 lacks, and no CI job can catch it: the type
      # error is what should have stopped it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
