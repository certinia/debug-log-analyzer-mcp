version: 2
updates:
  - package-ecosystem: 'npm' # reads pnpm-lock.yaml
    directory: '/'
    schedule:
      interval: 'weekly'
    versioning-strategy: auto
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    # Let a release settle before adopting it; a compromised publish is
    # usually yanked within days.
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
